<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 143 115" width="143" height="115">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Base Card -->
  <rect x="2" y="2" width="139" height="111" rx="10" fill="#FCFBF8" stroke="#EFECE6" stroke-width="1" filter="url(#cardShadow)"/>

  <!-- Official Logo Image from User -->
  <image href="data:image/png;base64," x="12" y="8" width="119" height="68" preserveAspectRatio="xMidYMid meet"/>

  <!-- Title Text matching other cards -->
  <text x="71.5" y="88" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E293B" letter-spacing="0.02em">HR SUCCESS TALK</text>

  <!-- Subtitle Text -->
  <text x="71.5" y="100" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="6.5" font-weight="500" fill="#64748B">Knowledge &amp; HR Partner</text>
</svg>